<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fair Bench Run</title>
<script src="coi-serviceworker.js"></script>
<style>
  body { margin: 0; background: #0b0e14; color: #c8cfdc; font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 960px; height: 540px; max-width: 100%; height: auto; }
  #s { padding: 6px 10px; font-family: ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="s">loading…</div>
<script type="module">
// Runs one setup (threejs | rust-jolt | rust-rapier | rust-avian) with the shared protocol.
// URL: ?setup=…&threads=4&n=2000&seed=1&render=1. Result: window.__RESULT__ and postMessage to the parent.
import { run } from './shared/runner.js';
import { makeJoltWorld } from './shared/jolt-world.js';

const q = new URLSearchParams(location.search);
const p = { setup: q.get('setup') || 'threejs', threads: +(q.get('threads') || 4), n: +(q.get('n') || 2000), seed: +(q.get('seed') || 1), render: q.get('render') !== '0' };
const el = document.getElementById('s');
const canvas = document.getElementById('c');
p.onStatus = (s) => (el.textContent = `${p.setup}: ${s}`);

function gpuName() {
  const gl = document.createElement('canvas').getContext('webgl2');
  const ext = gl?.getExtension('WEBGL_debug_renderer_info');
  return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : null;
}

async function adapter() {
  const cv = p.render ? canvas : null;
  if (!p.render) canvas.style.display = 'none';
  let Jolt;
  if (p.setup === 'threejs' || p.setup === 'rust-jolt') Jolt = await (await import('./vendor/jolt-physics.multithread.wasm.js')).default();
  if (p.setup === 'threejs') return (await import('./shared/threejs.js')).create(Jolt, p.threads, cv, p.n);
  globalThis.__makeJoltWorld = (threads) => makeJoltWorld(Jolt, threads);
  const rust = await import('./rust/fairbench.js');
  await rust.default();
  const sim = new rust.Sim(p.setup.replace('rust-', ''), p.threads, cv ?? undefined, p.n);
  return {
    workers: sim.worker_threads(),
    spawn: (d) => sim.spawn(d),
    step: () => sim.step(),
    sync: () => sim.sync(),
    render: () => sim.render(),
    lost: (y) => Array.from(sim.lost(y, 30)),
    awake: () => sim.awake(),
  };
}

const meta = { setup: p.setup, threads: p.threads, n: p.n, seed: p.seed, render: p.render, crossOriginIsolated, hardwareConcurrency: navigator.hardwareConcurrency, gpu: gpuName(), userAgent: navigator.userAgent };
let result;
try {
  const a = await adapter();
  meta.workers = a.workers;
  result = { ...meta, ...(await run(a, p)) };
} catch (e) {
  result = { ...meta, error: String(e?.stack || e), valid: false };
}
window.__RESULT__ = result;
parent.postMessage({ type: 'fairbench-result', result }, '*');
el.textContent = JSON.stringify(result, null, 1);
</script>
</body>
</html>
